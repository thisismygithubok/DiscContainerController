services:
  DiscContainerController:
    image: thisismynameok/disc-container-controller:latest
    container_name: DiscContainerController
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}
      TZ: ${TZ}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config:/config
    labels:
      section: "Example"

  # Optional: run this on another server instead, and add it to SecondaryHosts in the master's settings.json
  # DiscContainerController-Agent:
  #   image: thisismynameok/disc-container-controller:latest
  #   container_name: DiscContainerController-Agent
  #   command: ["python3", "agent.py"]
  #   environment:
  #     AGENT_TOKEN: ${AGENT_TOKEN}
  #     TZ: ${TZ}
  #     # AGENT_ENABLE_EDIT: "true"   # only for settings editing, with the /config mount below
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #     # - ./config:/config          # only for settings editing; owned by uid 1000
  #   ports:
  #     - "<private ip>:8080:8080"
