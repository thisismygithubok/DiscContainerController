services:
  DiscContainerController:
    image: thisismynameok/disc-container-controller:latest
    container_name: DiscContainerController
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}
      TZ: ${TZ}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config:/config
    labels:
      section: "Example"

  # Optional: run this on another server instead, and add it to Hosts in the master's settings.json
